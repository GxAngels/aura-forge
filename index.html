<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Forge</title>
    <style>
        :root {
            --bg-color: #0b0d17;
            --panel-bg: rgba(22, 27, 46, 0.8);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.15), transparent 60%);
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--panel-bg);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .auth-btn, .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .auth-btn:hover, .action-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .forge-section {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 30px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .display-rarity {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .aura-name {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .aura-chance {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .roll-btn {
            background: linear-gradient(135deg, #7c3aed, #c084fc);
            border: none;
            color: white;
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .roll-btn:active {
            transform: scale(0.96);
        }

        .roll-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .auto-btn, .fast-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .auto-btn.active {
            background: #ef4444;
            border-color: #f87171;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }

        .fast-btn.active {
            background: #eab308;
            border-color: #fde047;
            color: #000;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.4);
        }

        .auto-btn:disabled, .fast-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .tab-content {
            display: none;
            max-height: 280px;
            overflow-y: auto;
        }

        .tab-content.active {
            display: block;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            font-size: 0.85rem;
            padding: 6px 10px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
        }

        .grid-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .card-item {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .card-count {
            color: var(--accent);
        }

        .card-sub {
            color: var(--text-muted);
            font-size: 0.7rem;
            margin-top: 4px;
        }

        .craft-btn, .equip-btn {
            margin-top: 6px;
            width: 100%;
            padding: 4px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            background: var(--accent);
            color: white;
        }

        .craft-btn:disabled {
            background: #4b5563;
            cursor: not-allowed;
        }

        .equip-btn.equipped {
            background: #10b981;
        }

        /* RARITY COLORS */
        .rarity-common { color: #9ca3af; }
        .rarity-uncommon { color: #22c55e; }
        .rarity-rare { color: #3b82f6; }
        .rarity-epic { color: #a855f7; }
        .rarity-mythic { color: #ec4899; }
        .rarity-cosmic { color: #06b6d4; text-shadow: 0 0 10px rgba(6, 182, 212, 0.5); }
        .rarity-transcendent { color: #f59e0b; text-shadow: 0 0 12px rgba(245, 158, 11, 0.7); }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: #161b2e;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-content input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.3);
            color: white;
        }

        .auth-error {
            color: #ef4444;
            font-size: 0.8rem;
            text-align: center;
            display: none;
            font-weight: bold;
        }

        .user-tag {
            font-size: 0.9rem;
            color: #a78bfa;
            font-weight: bold;
        }

        .pop {
            animation: popAnim 0.15s ease-out;
        }

        @keyframes popAnim {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>

        function playSound(freq, type = 'sine', duration = 0.05, vol = 0.08) {
            try {
                if (!globalAudioCtx) {
                    globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (globalAudioCtx.state === 'suspended') {
                    globalAudioCtx.resume();
                }
                const oscillator = globalAudioCtx.createOscillator();
                const gainNode = globalAudioCtx.createGain();

                oscillator.type = type;
                oscillator.frequency.setValueAtTime(freq, globalAudioCtx.currentTime);
                gainNode.gain.setValueAtTime(vol, globalAudioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, globalAudioCtx.currentTime + duration);

                oscillator.connect(gainNode);
                gainNode.connect(globalAudioCtx.destination);

                oscillator.start();
                oscillator.stop(globalAudioCtx.currentTime + duration);
            } catch (e) {}
        }

        function updateUnlocks() {
            if (totalRolls >= 25) {
                autoBtn.disabled = false;
                autoBtn.title = "Toggle Auto Roll";

                fastBtn.disabled = false;
                fastBtn.title = "Toggle Fast Roll";
                if (!fastRollEnabled) fastBtn.textContent = "FAST: OFF";
            } else {
                fastBtn.disabled = true;
                fastBtn.textContent = `FAST (${125 - totalRolls} left)`;
            }
        }

        function initUserSystem() {
            const activeUser = localStorage.getItem('aura_forge_user');
            if (activeUser) {
                currentUser = activeUser;
                loadUserData(currentUser);
            }
            renderAuthUI();
            updateUnlocks();
        }

        function renderAuthUI() {
            const authSection = document.getElementById('authSection');
            if (currentUser) {
                authSection.innerHTML = `
                    <span class="user-tag">👤 ${currentUser}</span>
                    <button class="auth-btn" id="logoutBtn">LOGOUT</button>
                `;
                document.getElementById('logoutBtn').onclick = logout;
            } else {
                authSection.innerHTML = `
                    <button class="auth-btn" id="loginBtn">LOGIN</button>
                    <button class="auth-btn" id="registerBtn">REGISTER</button>
                `;
                document.getElementById('loginBtn').onclick = () => openAuthModal('login');
                document.getElementById('registerBtn').onclick = () => openAuthModal('register');
            }
        }

        function openAuthModal(mode) {
            currentAuthMode = mode;
            document.getElementById('modalTitle').textContent = mode === 'login' ? 'Login Account' : 'Register Account';
            document.getElementById('usernameInput').value = '';
            document.getElementById('passwordInput').value = '';
            authError.style.display = 'none';
            document.getElementById('authModal').classList.add('active');
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('active');
        }

        function showAuthError(msg) {
            authError.textContent = msg;
            authError.style.display = 'block';
        }

        function submitAuth() {
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();

            if (!user || !pass) {
                showAuthError("⚠️ Please fill in all fields!");
                return;
            }

            const accounts = JSON.parse(localStorage.getItem('aura_forge_accounts') || '{}');

            if (currentAuthMode === 'register') {
                if (accounts[user]) {
                    showAuthError("⚠️️ Username already exists! Choose another.");
                    return;
                }
                accounts[user] = { 
                    password: pass, 
                    data: { totalRolls: 0, inventory: {}, craftedItems: {}, equippedItem: null } 
                };
                localStorage.setItem('aura_forge_accounts', JSON.stringify(accounts));
                currentUser = user;
            } else {
                if (!accounts[user]) {
                    showAuthError("⚠️ Account does not exist!");
                    return;
                }
                if (accounts[user].password !== pass) {
                    showAuthError("⚠️ Incorrect password!");
                    return;
                }
                currentUser = user;
            }

            localStorage.setItem('aura_forge_user', currentUser);
            loadUserData(currentUser);
            renderAuthUI();
            closeAuthModal();
        }

        function logout() {
            saveUserData();
            currentUser = null;
            localStorage.removeItem('aura_forge_user');
            totalRolls = 0;
            inventory = {};
            craftedItems = {};
            equippedItem = null;
            history = [];
            
            totalRollsDisplay.textContent = `Rolls: 0`;
            renderHistory();
            renderInventory();
            renderCrafting();
            renderAuthUI();
            updateUnlocks();
        }

        function saveUserData() {
            if (!currentUser) return;
            const accounts = JSON.parse(localStorage.getItem('aura_forge_accounts') || '{}');
            if (accounts[currentUser]) {
                accounts[currentUser].data = {
                    totalRolls,
                    inventory,
                    craftedItems,
                    equippedItem
                };
                localStorage.setItem('aura_forge_accounts', JSON.stringify(accounts));
            }
        }

        function loadUserData(user) {
            const accounts = JSON.parse(localStorage.getItem('aura_forge_accounts') || '{}');
            if (accounts[user] && accounts[user].data) {
                const data = accounts[user].data;
                totalRolls = data.totalRolls || 0;
                inventory = data.inventory || {};
                craftedItems = data.craftedItems || {};
                equippedItem = data.equippedItem || null;

                totalRollsDisplay.textContent = `Rolls: ${totalRolls}`;
                renderInventory();
                renderCrafting();
                updateUnlocks();
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'inventory') {
                document.getElementById('tabInvBtn').classList.add('active');
                inventoryTab.classList.add('active');
            } else {
                document.getElementById('tabCraftBtn').classList.add('active');
                craftingTab.classList.add('active');
                renderCrafting();
            }
        }

        function getRandomAura() {
            let luckMultiplier = 1.0;
            const equippedObj = craftables.find(c => c.id === equippedItem);
            if (equippedObj && equippedObj.buffType === 'luck') {
                luckMultiplier = equippedObj.value;
            }

            const rand = Math.floor(Math.random() * 10000000000) + 1;
            const sortedAuras = [...auras].sort((a, b) => b.chance - a.chance);
            
            for (let aura of sortedAuras) {
                const threshold = (10000000000 / aura.chance) * luckMultiplier;
                if (rand <= threshold) {
                    return aura;
                }
            }
            return auras[0];
        }

        function roll() {
            if (isRolling) return;
            isRolling = true;
            rollBtn.disabled = true;

            totalRolls++;
            totalRollsDisplay.textContent = `Rolls: ${totalRolls}`;
            updateUnlocks();

            if (fastRollEnabled) {
                const finalAura = getRandomAura();
                auraRarity.textContent = finalAura.chance >= 10000 ? "RARE DISCOVERY!" : "DISCOVERED!";
                auraDisplay.textContent = finalAura.name;
                auraChance.textContent = `1 / ${finalAura.chance.toLocaleString()}`;
                auraDisplay.className = "aura-name pop " + finalAura.class;

                if (finalAura.chance >= 1000000) {
                    playSound(900, 'sine', 0.2, 0.15);
                } else {
                    playSound(523, 'sine', 0.04, 0.05);
                }

                addToHistory(finalAura);
                addToInventory(finalAura);
                saveUserData();

                isRolling = false;
                if (!autoRolling) {
                    rollBtn.disabled = false;
                }
                return;
            }

            let counter = 0;
            let maxTicks = 12;
            let intervalTime = 40;

            const equippedObj = craftables.find(c => c.id === equippedItem);
            if (equippedObj) {
                if (equippedObj.buffType === 'speed') intervalTime = Math.floor(intervalTime * equippedObj.value);
                if (equippedObj.buffType === 'ticks') maxTicks = equippedObj.value;
            }

            const rollInterval = setInterval(() => {
                const randomAura = auras[Math.floor(Math.random() * auras.length)];
                auraRarity.textContent = "FORGING...";
                auraDisplay.textContent = randomAura.name;
                auraChance.textContent = `1 / ${randomAura.chance.toLocaleString()}`;
                auraDisplay.className = "aura-name " + randomAura.class;
                
                playSound(250 + (counter * 12), 'triangle', 0.02, 0.03);
                counter++;

                if (counter >= maxTicks) {
                    clearInterval(rollInterval);

                    const finalAura = getRandomAura();
                    auraRarity.textContent = finalAura.chance >= 10000 ? "RARE DISCOVERY!" : "DISCOVERED!";
                    auraDisplay.textContent = finalAura.name;
                    auraChance.textContent = `1 / ${finalAura.chance.toLocaleString()}`;
                    auraDisplay.className = "aura-name pop " + finalAura.class;

                    if (finalAura.chance >= 1000000) {
                        playSound(900, 'sine', 0.3, 0.15);
                    } else {
                        playSound(523, 'sine', 0.08, 0.08);
                    }

                    addToHistory(finalAura);
                    addToInventory(finalAura);
                    saveUserData();

                    isRolling = false;
                    if (!autoRolling) {
                        rollBtn.disabled = false;
                    }
                }
            }, intervalTime);
        }

        function addToHistory(aura) {
            history.unshift(aura);
            if (history.length > 8) history.pop();
            renderHistory();
        }

        function renderHistory() {
            historyList.innerHTML = '';
            history.forEach(itemData => {
                const item = document.createElement('div');
                item.className = `history-item ${itemData.class}`;
                item.textContent = `${itemData.name} (1/${itemData.chance.toLocaleString()})`;
                historyList.appendChild(item);
            });
        }

        function addToInventory(aura) {
            if (inventory[aura.name]) {
                inventory[aura.name].count++;
            } else {
                inventory[aura.name] = { count: 1, data: aura };
            }
            renderInventory();
        }

        function renderInventory() {
            inventoryTab.innerHTML = '';
            const sortedKeys = Object.keys(inventory).sort((a, b) => inventory[b].data.chance - inventory[a].data.chance);

            if (sortedKeys.length === 0) {
                inventoryTab.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:var(--text-muted); padding:20px;">No auras discovered yet. Press Forge!</div>`;
                return;
            }

            sortedKeys.forEach(key => {
                const entry = inventory[key];
                const card = document.createElement('div');
                card.className = 'card-item';
                card.innerHTML = `
                    <div class="card-top">
                        <span class="${entry.data.class}">${entry.data.name}</span>
                        <span class="card-count">x${entry.count}</span>
                    </div>
                    <div class="card-sub">1 / ${entry.data.chance.toLocaleString()}</div>
                `;
                inventoryTab.appendChild(card);
            });
        }

        function renderCrafting() {
            craftingTab.innerHTML = '';
            craftables.forEach(item => {
                let canCraft = true;
                for (let [auraName, reqCount] of Object.entries(item.cost)) {
                    if (!inventory[auraName] || inventory[auraName].count < reqCount) {
                        canCraft = false;
                        break;
                    }
                }

                const isCrafted = craftedItems[item.id];
                const isEquipped = equippedItem === item.id;
                let costText = Object.entries(item.cost).map(([name, count]) => `${count}x ${name}`).join(', ');

                const card = document.createElement('div');
                card.className = 'card-item';
                card.innerHTML = `
                    <div class="card-top">
                        <span style="color: #c084fc;">${item.name}</span>
                    </div>
                    <div class="card-sub">${item.desc}</div>
                    <div class="card-sub" style="margin-top:2px;">Cost: ${costText}</div>
                    ${!isCrafted ? `<button class="craft-btn" ${!canCraft ? 'disabled' : ''} onclick="craftItem('${item.id}')">Forge</button>` : 
                      `<button class="equip-btn ${isEquipped ? 'equipped' : ''}" onclick="toggleEquip('${item.id}')">${isEquipped ? 'Equipped' : 'Equip'}</button>`}
                `;
                craftingTab.appendChild(card);
            });
        }

        function craftItem(itemId) {
            const item = craftables.find(i => i.id === itemId);
            if (!item) return;

            for (let [auraName, reqCount] of Object.entries(item.cost)) {
                inventory[auraName].count -= reqCount;
                if (inventory[auraName].count <= 0) {
                    delete inventory[auraName];
                }
            }

            craftedItems[itemId] = true;
            saveUserData();
            renderInventory();
            renderCrafting();
        }

        function toggleEquip(itemId) {
            equippedItem = equippedItem === itemId ? null : itemId;
            saveUserData();
            renderCrafting();
        }

        // EVENT LISTENERS
        document.getElementById('tabInvBtn').addEventListener('click', () => switchTab('inventory'));
        document.getElementById('tabCraftBtn').addEventListener('click', () => switchTab('crafting'));
        document.getElementById('confirmAuthBtn').addEventListener('click', submitAuth);
        document.getElementById('cancelAuthBtn').addEventListener('click', closeAuthModal);

        autoBtn.addEventListener('click', () => {
            if (totalRolls < 25) return;
            autoRolling = !autoRolling;
            if (autoRolling) {
                autoBtn.classList.add('active');
                autoBtn.textContent = "AUTO: ON";
                rollBtn.disabled = true;
                
                autoInterval = setInterval(() => {
                    if (!isRolling) roll();
                }, fastRollEnabled ? 150 : 650);
            } else {
                autoBtn.classList.remove('active');
                autoBtn.textContent = "AUTO: OFF";
                clearInterval(autoInterval);
                if (!isRolling) rollBtn.disabled = false;
            }
        });

        fastBtn.addEventListener('click', () => {
            if (totalRolls < 125) return;
            fastRollEnabled = !fastRollEnabled;
            if (fastRollEnabled) {
                fastBtn.classList.add('active');
                fastBtn.textContent = "FAST: ON";
            } else {
                fastBtn.classList.remove('active');
                fastBtn.textContent = "FAST: OFF";
            }

            if (autoRolling) {
                clearInterval(autoInterval);
                autoInterval = setInterval(() => {
                    if (!isRolling) roll();
                }, fastRollEnabled ? 150 : 650);
            }
        });

        rollBtn.addEventListener('click', roll);

        initUserSystem();
        renderHistory();
        renderInventory();
    </script>
</body>
</html>
