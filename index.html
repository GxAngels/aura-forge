<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Forge</title>
    <style>
        :root {
            --bg-color: #0b0d17;
            --panel-bg: rgba(22, 27, 46, 0.8);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.15), transparent 60%);
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--panel-bg);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .auth-btn, .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .auth-btn:hover, .action-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .forge-section {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 30px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .display-rarity {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .aura-name {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .aura-chance {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .roll-btn {
            background: linear-gradient(135deg, #7c3aed, #c084fc);
            border: none;
            color: white;
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .roll-btn:active {
            transform: scale(0.96);
        }

        .roll-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .auto-btn, .fast-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .auto-btn.active {
            background: #ef4444;
            border-color: #f87171;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }

        .fast-btn.active {
            background: #eab308;
            border-color: #fde047;
            color: #000;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.4);
        }

        .auto-btn:disabled, .fast-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .tab-content {
            display: none;
            max-height: 280px;
            overflow-y: auto;
        }

        .tab-content.active {
            display: block;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            font-size: 0.85rem;
            padding: 6px 10px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
        }

        .grid-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .card-item {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .card-count {
            color: var(--accent);
        }

        .card-sub {
            color: var(--text-muted);
            font-size: 0.7rem;
            margin-top: 4px;
        }

        .craft-btn, .equip-btn {
            margin-top: 6px;
            width: 100%;
            padding: 4px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            background: var(--accent);
            color: white;
        }

        .craft-btn:disabled {
            background: #4b5563;
            cursor: not-allowed;
        }

        .equip-btn.equipped {
            background: #10b981;
        }

        /* RARITY COLORS */
        .rarity-common { color: #9ca3af; }
        .rarity-uncommon { color: #22c55e; }
        .rarity-rare { color: #3b82f6; }
        .rarity-epic { color: #a855f7; }
        .rarity-mythic { color: #ec4899; }
        .rarity-cosmic { color: #06b6d4; text-shadow: 0 0 10px rgba(6, 182, 212, 0.5); }
        .rarity-transcendent { color: #f59e0b; text-shadow: 0 0 12px rgba(245, 158, 11, 0.7); }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: #161b2e;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-content input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.3);
            color: white;
        }

        .auth-error {
            color: #ef4444;
            font-size: 0.8rem;
            text-align: center;
            display: none;
            font-weight: bold;
        }

        .user-tag {
            font-size: 0.9rem;
            color: #a78bfa;
            font-weight: bold;
        }

        .pop {
            animation: popAnim 0.15s ease-out;
        }

        @keyframes popAnim {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
